<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amplitude Web SDK Test</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:           #EDF1F8;
    --surface:      #FFFFFF;
    --surface-2:    #F6F9FD;
    --ink:          #0A2545;
    --ink-soft:     #46566E;
    --ink-faint:    #8492A8;
    --line:         #D5DEEC;
    --yonsei:       #00337F;
    --yonsei-mid:   #1E5FB0;
    --yonsei-light: #E6EDF7;
    --yonsei-line:  #C4D4EA;
    --radius:       14px;
    --maxw:         820px;

    --serif: "Noto Serif KR", Georgia, "Apple SD Gothic Neo", serif;
    --sans:  "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
    --mono:  "IBM Plex Mono", "SF Mono", ui-monospace, "Menlo", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink-soft);
    font-family: var(--sans);
    font-weight: 400;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 72px 24px 120px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--ink-faint);
    margin: 0 0 18px;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: clamp(34px, 6.5vw, 54px);
    line-height: 1.18;
    color: var(--ink);
    margin: 0 0 56px;
    letter-spacing: -0.01em;
  }

  h1 .accent { color: var(--yonsei); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--yonsei);
    border-radius: var(--radius);
    padding: 26px 28px;
    margin-bottom: 20px;
  }

  .label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    color: var(--ink-faint);
    margin-bottom: 12px;
  }

  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  input[type="text"] {
    flex: 1 1 240px;
    min-width: 0;
    font-family: var(--sans);
    font-size: 15px;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    outline: none;
    transition: border-color .15s ease, background .15s ease;
  }

  input[type="text"]::placeholder { color: var(--ink-faint); }

  input[type="text"]:focus {
    border-color: var(--yonsei-mid);
    background: var(--surface);
  }

  button {
    flex: 0 0 auto;
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    background: var(--yonsei);
    border: 1px solid var(--yonsei);
    border-radius: 10px;
    padding: 12px 26px;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }

  button:hover { background: var(--yonsei-mid); border-color: var(--yonsei-mid); }
  button:active { transform: translateY(1px); }

  :focus-visible {
    outline: 2px solid var(--yonsei-mid);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="wrap">
  <p class="eyebrow">Amplitude Browser SDK 2 · Test Page</p>
  <h1>Amplitude <span class="accent">Web SDK</span> 테스트</h1>

  <div class="card">
    <label class="label" for="user-id-input">User ID</label>
    <div class="row">
      <input type="text" id="user-id-input" placeholder="User ID 를 입력하세요" autocomplete="off">
      <button type="button" id="set-user-id-btn">Set</button>
    </div>
  </div>

  <div class="card">
    <label class="label" for="event-name-input">Event Name</label>
    <div class="row">
      <input type="text" id="event-name-input" placeholder="이벤트명을 입력하세요" autocomplete="off">
      <button type="button" id="send-event-btn">Send</button>
    </div>
  </div>
</div>

<!-- Amplitude Browser SDK 2 -->
<script src="https://cdn.amplitude.com/libs/analytics-browser-2.45.5-min.js.gz"></script>


<script>
/* ══════════════════════════════════════════════════════════════════════════
 *  고객사 구현 영역 — Amplitude 와 무관한 코드
 *  아래 SessionStore / AuthAPI 는 예시이며, 고객사 환경에 맞게 직접 구현한다.
 * ══════════════════════════════════════════════════════════════════════════ */

/** 웹 자체 User ID 캐시. Amplitude SDK 저장소(쿠키)와 완전히 별개다. */
var SessionStore = {
  KEY: 'userId',
  getCachedUserId: function () {
    return localStorage.getItem(this.KEY);
  },
  setCachedUserId: function (userId) {
    localStorage.setItem(this.KEY, userId);
  }
};

/** 원문 User ID 가명처리 API.
 *  ⚠️ 실제 운영에서는 고객사 서버 엔드포인트를 호출한다.
 *     HMAC-SHA256 은 반드시 서버에서 수행 (Secret Key 클라이언트 포함 금지).
 *  아래는 테스트용 dummy 구현 — 'pseudo_' + SHA-256(원문) 앞 16 hex.
 */
var AuthAPI = {
  pseudonymize: function (rawUserId, timeoutMs) {
    var request = crypto.subtle
      .digest('SHA-256', new TextEncoder().encode(rawUserId))
      .then(function (buf) {
        var hex = Array.from(new Uint8Array(buf))
          .map(function (b) { return b.toString(16).padStart(2, '0'); })
          .join('');
        return 'pseudo_' + hex.slice(0, 16);
      });

    var timeout = new Promise(function (_, reject) {
      setTimeout(function () { reject(new Error('pseudonymize timeout')); }, timeoutMs);
    });

    return Promise.race([request, timeout]);
  }
};
</script>


<script>
/* ══════════════════════════════════════════════════════════════════════════
 *  ★ Amplitude 연동 코드
 * ══════════════════════════════════════════════════════════════════════════ */

var AnalyticsManager = (function () {

  var AMPLITUDE_API_KEY  = '7c52da39bdca1eb3c24dcb0503841b72'; // 신규 프로젝트 API Key
  var MIGRATION_FLAG_KEY = 'amp_pseudonym_migrated_v2';

  var ready; // 초기화 완료 Promise

  /**
   * 페이지 로드 시 호출.
   * ⚠️ SDK 초기화보다 가명화가 먼저 완료되어야 하므로,
   *    이 함수가 완료되기 전에는 어떤 이벤트도 트래킹하지 않는다.
   */
  function start() {
    ready = (async function () {

      // (1) SDK 초기화 이전: 최초 실행 플래그 확인 + 웹 자체 캐시의 User ID 확인
      var migrated  = localStorage.getItem(MIGRATION_FLAG_KEY) === 'true';
      var rawUserId = SessionStore.getCachedUserId();

      if (migrated || !rawUserId) {
        // 플래그 있음(마이그레이션 완료) 또는 캐시된 User ID 없음(미로그인)
        initSDK(null);
        return;
      }

      // (2) SDK 초기화 이전: 서버에 가명화 요청 후 완료까지 대기
      //     구버전에서 로그인했던 유저는 재로그인 없이도 가명 식별값으로 맥락 유지
      //     ⚠️ HMAC-SHA256 은 반드시 서버에서 수행 (Secret Key 클라이언트 포함 금지)
      try {
        var pseudonymizedUserId = await AuthAPI.pseudonymize(rawUserId, 3000);

        initSDK(pseudonymizedUserId);                       // (3) 가명 식별값과 함께 초기화
        localStorage.setItem(MIGRATION_FLAG_KEY, 'true');   // (4) 플래그 저장
      } catch (e) {
        // 실패: userId 없이 초기화 (이벤트는 신규 device_id 기준으로 유입)
        // 플래그 미저장 → 다음 실행에서 재시도
        initSDK(null);
      }
    })();

    return ready;
  }

  function initSDK(pseudonymizedUserId) {
    // Configuration Options 은 모두 기본 설정.
    //
    // ⚠️ 웹의 구버전 SDK 캐시 격리는 API Key 교체만으로 자동 달성된다.
    //    Browser SDK 2 는 identity 정보를 `AMP_{API Key 앞 10자}` 쿠키에 저장하므로,
    //    신규 API Key 로 초기화하면 쿠키 이름이 달라져 구 Key 의 쿠키를 읽지 않는다.
    //    (삭제가 아니라 미참조 격리 → 구 SDK 캐시의 원문 User ID 미승계)
    //    부수 효과로 device_id 가 신규 UUID 로 생성된다.
    //    → iOS/Android 의 instanceName 격리에 대응하는 웹 조치이며, 별도 설정이 필요 없다.
    //
    // userId 는 init 인자로 전달한다. 초기화 직후 autocapture 가 보내는
    // 첫 이벤트(page view)부터 가명 식별값이 부여되도록 보장하기 위함이다.
    amplitude.init(AMPLITUDE_API_KEY, pseudonymizedUserId || undefined);
  }

  /** 로그인 성공 시: 서버 로그인 응답에 포함된 가명 식별값을 설정 */
  function onLoginSuccess(pseudonymizedUserId) {
    amplitude.setUserId(pseudonymizedUserId);
    localStorage.setItem(MIGRATION_FLAG_KEY, 'true');
  }

  /** 이벤트 전송. 초기화가 끝난 뒤에만 전송한다. */
  async function track(eventName) {
    await ready;
    amplitude.track(eventName);
  }

  return { start: start, onLoginSuccess: onLoginSuccess, track: track };
})();

AnalyticsManager.start();
</script>


<script>
/* ══════════════════════════════════════════════════════════════════════════
 *  테스트 페이지 UI 바인딩
 * ══════════════════════════════════════════════════════════════════════════ */

// User ID 입력 + Set → 로그인 성공 시나리오
document.getElementById('set-user-id-btn').addEventListener('click', async function () {
  var rawUserId = document.getElementById('user-id-input').value.trim();
  if (!rawUserId) return;

  // 원문은 웹 자체 캐시에만 저장하고, Amplitude 에는 가명 식별값만 전달한다.
  SessionStore.setCachedUserId(rawUserId);

  var pseudonymizedUserId = await AuthAPI.pseudonymize(rawUserId, 3000);
  AnalyticsManager.onLoginSuccess(pseudonymizedUserId);
});

// 이벤트명 입력 + Send → 이벤트 전송
document.getElementById('send-event-btn').addEventListener('click', function () {
  var eventName = document.getElementById('event-name-input').value.trim();
  if (!eventName) return;

  AnalyticsManager.track(eventName);
});
</script>

</body>
</html>
