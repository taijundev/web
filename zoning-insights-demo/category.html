<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>카테고리 | 번쩍마켓</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235B2EE5'/><text x='16' y='23' font-size='19' text-anchor='middle'>⚡</text></svg>">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/amplitude.js"></script>
</head>
<body data-screen="category">

<div class="app">

  <header class="hdr" id="zone-header" data-zone="header">
    <div class="hdr__page">
      <a class="icon-btn" href="index.html" aria-label="뒤로">‹</a>
      <h1 class="hdr__title" id="cat-title">전체 상품</h1>
    </div>
  </header>

  <!-- ============ 존: 카테고리 칩 ============ -->
  <nav class="chips" id="cat-chips" data-zone="category-chips" aria-label="카테고리 선택"></nav>

  <!-- ============ 존: 정렬 필터 ============ -->
  <section class="section" id="zone-filter" data-zone="sort-filter" style="padding-top:14px;padding-bottom:14px">
    <div class="section__head" style="margin-bottom:10px">
      <span class="section__sub">총 <strong id="cat-count" style="color:var(--ink)">0개</strong></span>
    </div>
    <div class="chips" id="cat-sort" style="padding:0;border:0;position:static;background:none">
      <button class="chip is-on" type="button" data-sort="recent">최신순</button>
      <button class="chip" type="button" data-sort="popular">인기순</button>
      <button class="chip" type="button" data-sort="low">낮은 가격순</button>
      <button class="chip" type="button" data-sort="high">높은 가격순</button>
    </div>
  </section>

  <!-- ============ 존: 상품 목록 ============ -->
  <section class="section" id="zone-list" data-zone="category-product-list">
    <div class="grid" id="cat-grid"></div>
  </section>

  <nav class="nav" id="zone-bottomnav" data-zone="bottom-nav" aria-label="주요 메뉴">
    <a class="nav__item" href="index.html"><span class="nav__icon">🏠</span>홈</a>
    <a class="nav__item is-on" href="category.html?c=all"><span class="nav__icon">☰</span>카테고리</a>
    <a class="nav__item nav__sell" href="mypage.html"><span class="nav__icon">＋</span>판매하기</a>
    <a class="nav__item" href="search.html"><span class="nav__icon">🔍</span>검색</a>
    <a class="nav__item" href="mypage.html"><span class="nav__icon">👤</span>마이</a>
  </nav>

</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/debug-panel.js"></script>
</body>
</html>
